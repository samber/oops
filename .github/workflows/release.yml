name: Release
on:
  workflow_dispatch:
    inputs:
      semver:
        type: string
        description: 'Semver (eg: v1.2.3)'
        required: true
jobs:
  release:
    if: github.triggering_actor == 'samber'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 [pinned by action-pin]
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 [pinned by action-pin]
        with:
          go-version: 1.21
          stable: false
      # for this repository, we do not run test on release, because it need to be executed in a specific setup, with a specific path

      # - name: Test

      #   run: make test

      # remove tests to clean dependencies
      - name: Remove xxx_test.go files
        run: rm -rf $(find . -type f -name "*_test.go" ! -name "*_example_test.go") ./examples ./assets ./docs
      # cleanup test dependencies
      - name: Cleanup dependencies
        run: go mod tidy
      - name: List files
        run: tree -Cfi
      - name: Write new go.mod into logs
        run: cat go.mod
      - name: Write new go.sum into logs
        run: cat go.sum
      - name: Create tag
        run: |
          git config --global user.name '${{ github.triggering_actor }}'
          git config --global user.email "${{ github.triggering_actor}}@users.noreply.github.com"

          git add .
          git commit --allow-empty -m 'bump ${{ inputs.semver }}'
          git tag ${{ inputs.semver }}
          git push origin ${{ inputs.semver }}
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 [pinned by action-pin]
        with:
          name: ${{ inputs.semver }}
          tag_name: ${{ inputs.semver }}
