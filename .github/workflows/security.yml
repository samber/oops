name: Security scan
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger
permissions:
  contents: read
  # required for codeql analysis

  security-events: write
jobs:
  # govulncheck:

  #   name: govulncheck

  #   runs-on: ubuntu-latest

  #   strategy:

  #     fail-fast: false

  #   steps:

  #     - uses: actions/checkout@v7

  #     - uses: actions/setup-go@v7

  #       with:

  #         go-version-file: go.mod

  #     - name: Install govulncheck

  #       run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

  #     - name: govulncheck

  #       run: govulncheck ./...
  bearer:
    name: bearer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 [pinned by action-pin]
      - name: Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2 [pinned by action-pin]
        with:
          skip-path: 'docs/'
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 [pinned by action-pin]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 [pinned by action-pin]
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 [pinned by action-pin]
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 [pinned by action-pin]
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 [pinned by action-pin]
  trivy-codeql:
    name: trivy-codeql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 [pinned by action-pin]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 [pinned by action-pin]
        with:
          go-version-file: go.mod
      - name: Run Trivy vulnerability scanner (source code)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 [pinned by action-pin]
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          skip-dirs: "docs/"
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 [pinned by action-pin]
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
  trivy-logs:
    name: trivy-logs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 [pinned by action-pin]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 [pinned by action-pin]
        with:
          go-version-file: go.mod
      - name: Run Trivy scanner (table output for logs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 [pinned by action-pin]
        if: always()
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"
          trivyignores: ".trivyignore"
          skip-dirs: "docs/"
      - name: Run Trivy scanner (license)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 [pinned by action-pin]
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: UNKNOWN,HIGH,CRITICAL
          format: table
          skip-dirs: "docs/"
