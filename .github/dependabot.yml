version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
  - package-ecosystem: gomod
    directory: /recovery/**
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
  - package-ecosystem: gomod
    directory: /loggers/**
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
